<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfume AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 700px;
    }

    .logo {
      text-align: center;
      margin-bottom: 35px;
    }

    .logo h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .logo p {
      color: #aaa;
      font-size: 16px;
    }

    .chat-box {
      background: #171717;
      border: 1px solid #333;
      border-radius: 20px;
      padding: 20px;
      min-height: 350px;
      margin-bottom: 15px;
    }

    .message {
      padding: 12px 16px;
      border-radius: 15px;
      margin-bottom: 12px;
      max-width: 80%;
      line-height: 1.5;
    }

    .ai-message {
      background: #262626;
      align-self: flex-start;
    }

    .user-message {
      background: #ffffff;
      color: #000000;
      margin-left: auto;
    }

    .input-area {
      display: flex;
      gap: 10px;
      background: #171717;
      border: 1px solid #333;
      border-radius: 18px;
      padding: 10px;
    }

    textarea {
      flex: 1;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      font-size: 16px;
      padding: 12px;
      height: 52px;
    }

    button {
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-size: 18px;
    }

    #micButton {
      width: 52px;
      background: #292929;
      color: white;
    }

    #sendButton {
      padding: 0 20px;
      background: white;
      color: black;
      font-weight: bold;
    }

    #micButton.listening {
      background: #b91c1c;
    }

    .status {
      text-align: center;
      color: #777;
      font-size: 13px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">
    <h1>Perfume AI</h1>
    <p>Kişisel parfüm danışmanın</p>
  </div>

  <div class="chat-box" id="chatBox">

    <div class="message ai-message">
      Merhaba. Nasıl bir parfüm aradığını anlat.
      İstersen mikrofon butonuna basarak konuşabilirsin.
    </div>

  </div>

  <div class="input-area">

    <button id="micButton" title="Konuş">
      🎙️
    </button>

    <textarea
      id="messageInput"
      placeholder="Örn: Yaz için kalıcı ama çok tatlı olmayan bir parfüm arıyorum..."
    ></textarea>

    <button id="sendButton">
      Gönder
    </button>

  </div>

  <div class="status" id="status">
    Hazır
  </div>

</div>


<script>

const input = document.getElementById("messageInput");
const micButton = document.getElementById("micButton");
const sendButton = document.getElementById("sendButton");
const chatBox = document.getElementById("chatBox");
const status = document.getElementById("status");


// ------------------------
// MESAJ GÖNDERME
// ------------------------

function sendMessage() {

  const message = input.value.trim();

  if (!message) return;

  const userMessage = document.createElement("div");

  userMessage.className = "message user-message";
  userMessage.textContent = message;

  chatBox.appendChild(userMessage);

  input.value = "";

  chatBox.scrollTop = chatBox.scrollHeight;


  // Şimdilik geçici AI cevabı
  setTimeout(() => {

    const aiMessage = document.createElement("div");

    aiMessage.className = "message ai-message";

    aiMessage.textContent =
      "Mesajını aldım. AI bağlantısını bir sonraki aşamada ekleyeceğiz.";

    chatBox.appendChild(aiMessage);

    chatBox.scrollTop = chatBox.scrollHeight;

  }, 500);

}


sendButton.addEventListener("click", sendMessage);


// ENTER ile mesaj gönderme

input.addEventListener("keydown", function(event) {

  if (event.key === "Enter" && !event.shiftKey) {

    event.preventDefault();

    sendMessage();

  }

});


// ------------------------
// SES TANIMA
// ------------------------

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (SpeechRecognition) {

  const recognition = new SpeechRecognition();

  recognition.lang = "tr-TR";

  recognition.continuous = false;

  recognition.interimResults = false;

  recognition.maxAlternatives = 1;


  micButton.addEventListener("click", () => {

    try {

      recognition.start();

      status.textContent = "Dinliyorum...";

      micButton.classList.add("listening");

    } catch (error) {

      console.log(error);

    }

  });


  recognition.onresult = (event) => {

    const transcript =
      event.results[0][0].transcript;

    input.value = transcript;

    status.textContent = "Konuşma algılandı";

  };


  recognition.onend = () => {

    micButton.classList.remove("listening");

    status.textContent = "Hazır";

  };


  recognition.onerror = (event) => {

    status.textContent =
      "Ses algılanamadı: " + event.error;

    micButton.classList.remove("listening");

  };

}

else {

  micButton.disabled = true;

  status.textContent =
    "Bu tarayıcı sesli girişi desteklemiyor.";

}

</script>

</body>
</html>
